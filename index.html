<style>
:root{
  --navy:#0E2C4B; --navy-2:#163A5F; --ink:#16202B; --muted:#5A6A7A;
  --line:#DFE6EE; --bg:#FBFCFF; --tint:#F1F5FA; --accent:#B5462F;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 40px}
a{color:inherit}

header{position:sticky;top:0;z-index:50;background:rgba(251,252,255,.92);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:66px;gap:20px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand strong{font-family:var(--serif);font-size:19px;letter-spacing:.18em;color:var(--navy)}
.brand span{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
nav ul{display:flex;gap:24px;list-style:none;flex-wrap:wrap}
nav a{font-size:13.5px;color:var(--muted);text-decoration:none;letter-spacing:.04em;
  padding-bottom:3px;border-bottom:1px solid transparent;transition:.22s}
nav a:hover{color:var(--navy)}
nav a.on{color:var(--navy);border-bottom-color:var(--accent)}

.hero{padding:74px 0 58px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1.35fr .85fr;gap:64px;align-items:start}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.16em;color:var(--muted);margin-bottom:24px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--accent)}
h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.28;color:var(--navy);letter-spacing:.02em}
h1 em{font-style:normal;color:var(--accent)}
.sub{font-family:var(--serif);font-size:23px;color:var(--navy-2);margin-top:6px;letter-spacing:.04em}
.lead{margin-top:24px;font-size:14.5px;color:var(--muted);max-width:560px}
.intent{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px}
.tag{font-size:12.5px;color:var(--navy);background:#fff;border:1px solid var(--line);padding:6px 13px;letter-spacing:.03em}
.tag.hot{border-color:rgba(181,70,47,.35);color:var(--accent);background:#FDF6F4}

.profile{background:#fff;border:1px solid var(--line);box-shadow:0 26px 54px -36px rgba(14,44,75,.45);overflow:hidden}
.portrait{height:392px;background:var(--tint);overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 8%;display:block}
.pname{font-family:var(--serif);font-size:21px;color:var(--navy);font-weight:600;letter-spacing:.12em;padding:16px 22px 0}
.prole{font-size:11.5px;color:var(--muted);letter-spacing:.04em;padding:4px 22px 14px;border-bottom:1px solid var(--line)}
.profile .cap{font-size:10.5px;letter-spacing:.2em;color:var(--muted);margin:14px 22px 12px}
.profile .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;padding:0 22px}
.stat b{display:block;font-family:var(--serif);font-size:26px;line-height:1.2;color:var(--navy)}
.stat b i{font-style:normal;font-size:13px;margin-left:2px;color:var(--muted)}
.stat p{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.profile .foot{margin-top:18px;padding:12px 22px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}

section{padding:66px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:36px}
.sec-head .no{font-size:12px;letter-spacing:.2em;color:var(--accent);margin-bottom:8px}
.sec-head h2{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--navy);letter-spacing:.03em}
.sec-head p{font-size:13px;color:var(--muted);max-width:430px;text-align:right}

.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.course{background:#fff;border:1px solid var(--line);padding:24px;height:100%;transition:transform .25s,box-shadow .25s,border-color .25s}
.course:hover{transform:translateY(-4px);box-shadow:0 18px 34px -24px rgba(14,44,75,.45);border-color:#C9D6E4}
.course .k{font-size:11.5px;letter-spacing:.16em;color:var(--accent);margin-bottom:12px}
.course h3{font-family:var(--serif);font-size:17px;color:var(--navy);font-weight:600;margin-bottom:16px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.pill{font-size:12.5px;padding:4px 10px;background:var(--tint);color:var(--navy-2)}
.map{font-size:12.5px;color:var(--muted);padding-top:14px;border-top:1px dashed var(--line)}
.map em{font-style:normal;color:var(--accent)}

.skill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.skill{background:#fff;border:1px solid var(--line);padding:26px 24px;height:100%}
.skill .bar{height:3px;width:44px;background:var(--navy);margin-bottom:18px}
.skill.back .bar{background:var(--accent)}
.skill h3{font-family:var(--serif);font-size:16.5px;color:var(--navy);margin-bottom:4px}
.skill .en{font-size:11px;letter-spacing:.14em;color:#93A2B2;margin-bottom:16px}
.skill ul{list-style:none;font-size:13px;color:#3D4B5A}
.skill li{padding:7px 0;border-bottom:1px solid #F2F5F9;display:flex;gap:9px}
.skill li:last-child{border-bottom:0}
.skill li::before{content:"";width:5px;height:5px;background:#B9C6D4;margin-top:9px;flex:0 0 5px}

.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--line)}
.item{position:relative;padding-bottom:30px}
.item::before{content:"";position:absolute;left:-25px;top:8px;width:9px;height:9px;background:#fff;border:2px solid var(--navy);border-radius:50%}
.item h3{font-family:var(--serif);font-size:17px;color:var(--navy);letter-spacing:.02em}
.item .meta{font-size:12px;color:var(--accent);letter-spacing:.08em;margin:5px 0 8px}
.item p{font-size:13px;color:#4A5867;max-width:900px}

.project{display:grid;grid-template-columns:1.25fr .75fr;gap:34px;align-items:start}
.pcard{background:#fff;border:1px solid var(--line);padding:32px}
.pcard .tagline{font-size:11.5px;letter-spacing:.16em;color:var(--accent);margin-bottom:12px}
.pcard h3{font-family:var(--serif);font-size:22px;color:var(--navy);margin-bottom:14px}
.pcard p{font-size:13.5px;color:#485666;margin-bottom:18px}
.pcard .role{display:grid;gap:9px;font-size:13px;color:var(--navy-2)}
.pcard .role span{display:flex;gap:10px}
.pcard .role span::before{content:"—";color:#B9C6D4}
.impact{display:grid;gap:14px}
.impact div{background:var(--tint);padding:18px 20px;border-left:2px solid var(--navy)}
.impact b{font-family:var(--serif);font-size:24px;color:var(--navy);display:block}
.impact p{font-size:12px;color:var(--muted)}
.note{font-size:11.5px;color:#8C9AA8;margin-top:10px;line-height:1.7}

.awards{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
.award{font-size:12.5px;padding:8px 13px;border:1px solid var(--line);background:#fff;color:var(--navy-2)}
.award b{color:var(--accent);font-weight:500}

footer{background:var(--navy);color:#C3D2E0;padding:44px 0 40px}
footer .f1{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
footer h4{font-family:var(--serif);font-size:19px;color:#fff;font-weight:600;letter-spacing:.06em}
footer p{font-size:12.5px;color:#9FB4C8;margin-top:10px;letter-spacing:.03em}
footer .f2{margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14);font-size:11.5px;color:#8CA0B4}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

@media(max-width:960px){
  .wrap{padding:0 24px}
  .hero-grid,.project{grid-template-columns:1fr;gap:32px}
  h1{font-size:38px}
  .course-grid,.skill-grid{grid-template-columns:1fr}
  nav ul{gap:14px}
  nav a{font-size:12px}
  nav{height:auto;padding:14px 0;flex-wrap:wrap}
  .sec-head{flex-direction:column;align-items:flex-start;gap:8px}
  .sec-head p{text-align:left}
}
</style>
</head>

document.getElementById('footSlogan').textContent = 站点.页脚.口号;

document.getElementById('footNote').textContent = 站点.页脚.备注;
document.title = `${站点.姓名} · 个人主页｜${站点.一句话}`;

/* 滚动进场与导航高亮 */
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: .12 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

const links = [...document.querySelectorAll('nav a')];
const blocks = [...document.querySelectorAll('section, .hero')];
const navIO = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const id = e.target.id || 'intent';
      links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + id));
    }
  });
}, { rootMargin: '-40% 0px -55% 0px' });
blocks.forEach(b => navIO.observe(b));
</script>
</body>
